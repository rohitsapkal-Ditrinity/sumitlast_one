<title>Copy Baba — Medical Notes Ordering</title>
<style>
:root{--navy:#102a43;--blue:#1769aa;--teal:#0f766e;--gold:#f2b84b;--bg:#f7f9fc;--ink:#1e293b;--muted:#475569;--line:#cbd5e1;--white:#fff;--red:#dc2626;--green:#16a34a;--shadow:0 20px 40px #102a4310;--shadow-sm:0 4px 12px #102a4308}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--blue);color:#fff}button:hover{filter:brightness(.96)}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e8f0f8;color:var(--navy)}.dark{background:var(--navy)}.success{background:var(--teal)}.danger{background:#feeceb;color:var(--red)}.gold{background:var(--gold);color:#3a2b0b}.outline{background:transparent;border:1px solid var(--line);color:var(--ink)}.small{padding:6px 9px;font-size:12px}.wrap{max-width:1200px;margin:auto;padding:0 18px}.top{background:var(--navy);color:white;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px #0002}.topin{display:flex;align-items:center;gap:16px;min-height:70px}.brand{font-size:23px;font-weight:900;letter-spacing:-.7px;white-space:nowrap}.brand span{color:var(--gold)}.tag{font-size:11px;color:#c8d7e8}.nav{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}.nav button{background:transparent;color:#dce8f4;padding:9px 11px}.nav button.active,.nav button:hover{background:#ffffff1c;color:#fff}.cartpill{background:var(--gold)!important;color:#33260a!important}.hero{background:linear-gradient(115deg,#102a43,#1769aa);color:#fff;padding:38px 0}.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.08;margin:0 0 12px}.hero p{max-width:720px;color:#d8e8f6;margin:0 0 20px}.hero .eyebrow{color:#f6ca70;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;font-weight:800}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#ffffff18;border:1px solid #ffffff24;padding:8px 12px;border-radius:10px;font-size:13px}.section{padding:26px 0}.heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}.heading h2{margin:0;font-size:24px}.muted{color:var(--muted)}.tiny{font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}.cardbody{padding:15px}.card h3{margin:0 0 5px;font-size:17px}.card p{margin:5px 0;color:var(--muted);font-size:13px}.cover{height:120px;background:linear-gradient(135deg,#d9e9f7,#eaf5f2);display:flex;align-items:center;justify-content:center;color:#1769aa;font-size:38px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.pill{display:inline-block;padding:4px 8px;border-radius:30px;background:#eaf2fa;color:#24577d;font-size:11px;font-weight:800}.price{font-size:20px;font-weight:900;color:var(--teal)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:12px;font-weight:800;color:#475569}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1769aa18}.search{max-width:340px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}.hidden{display:none!important}.sublist{display:grid;gap:10px}.subitem{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fbfdff}.subitem h4{margin:0 0 7px}.variants{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.variant{border:1px solid var(--line);border-radius:10px;padding:10px;background:white}.variant strong{display:block}.variant .price{font-size:17px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{background:#f1f5f9;color:#475569}.status{display:inline-block;padding:4px 8px;border-radius:30px;background:#eaf2fa;font-size:11px;font-weight:800}.status.Pending{background:#fff3d7;color:#805400}.status.Confirmed{background:#e5f3ff;color:#13588b}.status.Processing{background:#eee9ff;color:#55369a}.status.Ready{background:#e5f7ed;color:#14663b}.status.Dispatched{background:#e5f7ed;color:#14663b}.status.Completed{background:#dcfce7;color:#166534}.status.Cancelled{background:#fee2e2;color:#991b1b}.notice{padding:12px 14px;border-radius:11px;background:#fff8e7;border:1px solid #f5d78c;color:#664b12;font-size:13px;margin:12px 0}.ok{background:#e9f8ef;border-color:#b5e2c5;color:#145b32}.dangertext{color:var(--red)}.footer{padding:28px 0;background:#0b2034;color:#c5d3e0;margin-top:30px}.footer strong{color:white}.modalback{position:fixed;inset:0;background:#061525aa;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:white;border-radius:17px;padding:20px;box-shadow:0 20px 60px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalhead h3{margin:0}.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:#102a43;color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:min(400px,90vw)}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.step{padding:7px 10px;border-radius:8px;background:#edf2f7;font-size:12px}.step.active{background:#dceeff;color:#14558a;font-weight:800}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.adminbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.adminbar button.active{background:var(--navy)}.qty{display:flex;align-items:center;gap:8px}.qty button{padding:4px 9px}.orderbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.orderbox h4{margin:0 0 6px}.link{color:var(--blue);text-decoration:underline;cursor:pointer;background:none;padding:0}.badgewarn{font-size:11px;color:#8a5a00;background:#fff2ce;padding:3px 7px;border-radius:20px}@media(max-width:700px){.topin{flex-wrap:wrap;padding:10px 0}.nav{margin:0;width:100%;overflow:auto}.hero{padding:28px 0}.heading{align-items:start;flex-direction:column}.search{max-width:none}.grid{grid-template-columns:1fr}.brand{font-size:21px}}

/* Admin catalogue accordions */
.catalogue-tree{display:grid;gap:11px}
.catalogue-subject{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 3px 12px #102a4308}
.catalogue-subject-head{display:flex;align-items:center;gap:12px;padding:14px 15px;background:linear-gradient(180deg,#fff,#f8fbfe)}
.catalogue-subject-head .subject-toggle,.catalogue-sub-head .sub-toggle{width:34px;height:34px;min-width:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:#eaf2fa;color:var(--navy);font-size:18px;border-radius:9px;transition:transform .18s ease,background .18s ease}
.catalogue-subject-head .subject-toggle:hover,.catalogue-sub-head .sub-toggle:hover{background:#dceafa}
.catalogue-subject-head .subject-name{font-size:15px;font-weight:850;flex:1;min-width:0}
.catalogue-subject-head .subject-meta{font-size:11px;color:var(--muted);white-space:nowrap}
.catalogue-subject-actions{display:flex;gap:6px;flex-wrap:wrap}
.catalogue-subject-body{padding:0 13px 13px;border-top:1px solid #edf2f7}
.catalogue-sublist{display:grid;gap:8px;padding-top:11px}
.catalogue-sub{border:1px solid #e2eaf2;border-radius:11px;overflow:hidden;background:#fbfdff}
.catalogue-sub-head{display:flex;align-items:center;gap:10px;padding:11px 12px}
.catalogue-sub-head .sub-name{font-weight:750;flex:1;min-width:0}
.catalogue-sub-head .sub-meta{font-size:11px;color:var(--muted);white-space:nowrap}
.catalogue-sub-actions{display:flex;gap:5px;flex-wrap:wrap}
.catalogue-sub-body{padding:0 12px 12px 56px}
.catalogue-sub-body .variant-summary{font-size:12px;color:var(--muted);line-height:1.8;margin:0 0 9px}
.catalogue-sub-body .variant-summary span{display:inline-block;background:#edf4fa;border-radius:7px;padding:3px 7px;margin:2px 3px 2px 0}
.accordion-arrow{display:inline-block;transition:transform .18s ease}
.accordion-arrow.open{transform:rotate(90deg)}
@media(max-width:650px){.catalogue-subject-head,.catalogue-sub-head{align-items:flex-start;flex-wrap:wrap}.catalogue-subject-head .subject-name,.catalogue-sub-head .sub-name{padding-top:7px}.catalogue-subject-head .subject-meta,.catalogue-sub-head .sub-meta{margin-left:46px}.catalogue-sub-body{padding-left:12px}.catalogue-subject-actions,.catalogue-sub-actions{width:100%;padding-left:46px}}

/* Enhanced UI styles */
.pagination{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.pagination .page-info{color:var(--muted);font-size:13px}
.orders-list{display:grid;gap:12px}
.orderbox{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;box-shadow:var(--shadow-sm)}
.status{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.status.Pending{background:#fef3c7;color:#92400e}
.status.Confirmed{background:#dbeafe;color:#1e40af}
.status.Processing{background:#e0f2fe;color:#075985}
.status.Ready{background:#dcfce7;color:#166534}
.status.Dispatched{background:#f3e8ff;color:#6b21a8}
.status.Completed{background:#dcfce7;color:#15803d}
.status.Cancelled{background:#fee2e2;color:#991b1b}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow-sm)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px #102a4310}
.cardbody{padding:16px}
.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:12px 14px;border-radius:10px;margin-top:14px}
.empty{padding:32px;text-align:center;color:var(--muted);background:#f8fafc;border:1px dashed var(--line);border-radius:12px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line)}
th{background:#f8fafc;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.qty{display:flex;align-items:center;gap:8px}
.modalback{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto}
.modal{background:#fff;border-radius:16px;max-width:680px;width:100%;box-shadow:0 40px 80px rgba(15,23,42,.25);max-height:90vh;overflow:auto}
.modalhead{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal form{padding:22px;display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:13px}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #93c5fd;outline-offset:1px;border-color:var(--blue)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:999px;box-shadow:0 20px 40px rgba(15,23,42,.3);z-index:200}
.toast.hidden{display:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.footer{margin-top:60px;background:#0f172a;color:#cbd5e1;padding:26px 0}
.footer .tiny{color:#94a3b8;font-size:13px}

</style></head>
<body>
<header class="top"><div class="wrap topin"><div><div class="brand">COPY <span>BABA</span></div><div class="tag">Medical notes ordering made simple</div></div><nav class="nav"><button class="active" data-page="home">Home</button><button data-page="catalog">Catalogue</button><button data-page="track">Track order</button><button data-page="admin">Admin</button><button class="cartpill" data-page="cart">Cart <b id="cartCount">0</b></button></nav></div></header>
<main id="app"></main>
<footer class="footer"><div class="wrap"><strong>Copy Baba</strong><p class="tiny">Medical notes ordering demo. Please verify all product descriptions, prices, availability and delivery details before accepting real orders.</p><p class="tiny">Standalone prototype · Data stored in this browser only · No online payment processing</p></div></footer>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const KEY='copybaba_standalone_v1';const ADMIN_EMAIL='admin@copybaba.demo';const ADMIN_PASS='CopyBaba123!';
const subjects=['Anatomy','Physiology','Biochemistry','Pathology','Pharmacology','Microbiology','Forensic Medicine','Community Medicine','ENT','Ophthalmology','General Medicine','General Surgery','Obstetrics & Gynaecology','Paediatrics','Orthopaedics','Dermatology','Psychiatry','Radiology','Anaesthesia'];
const defaultSubs=['Complete Notes','Exam Preparation'];
const seed=()=>({settings:{businessName:'Copy Baba',whatsappNumber:'',currency:'INR',packagePrice:3500,deliveryNote:'Delivery charges, if any, will be confirmed by the team.'},subjects:subjects.map((name,i)=>({id:'s'+(i+1),name,description:'Study notes and learning material for '+name+'. Please confirm the exact contents with Copy Baba before ordering.',image:'',subs:defaultSubs.map((sn,j)=>({id:`s${i+1}b${j+1}`,name:sn,description:'Curated '+sn.toLowerCase()+' for '+name+'.',variants:['High','Medium','Low','Regular'].map((q,k)=>({id:`s${i+1}b${j+1}v${k+1}`,name:q,price:3500,description:q+' quality package. Final contents and price can be confirmed by the team.',image:'',sampleUrl:'',available:true}))}))})),orders:[],cart:[],adminLoggedIn:false});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){db=seed()}function save(){localStorage.setItem(KEY,JSON.stringify(db));updateCartCount()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function id(prefix){return prefix+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3200)}function updateCartCount(){document.getElementById('cartCount').textContent=db.cart.reduce((a,x)=>a+x.qty,0)}function findVariant(sid,bid,vid){let s=db.subjects.find(x=>x.id===sid),b=s?.subs.find(x=>x.id===bid),v=b?.variants.find(x=>x.id===vid);return{s,b,v}}
function page(p){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({home:home,catalog:catalog,cart:cartPage,track:trackPage,admin:adminPage}[p]||home)();window.scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>page(b.dataset.page)));
function home(){document.getElementById('app').innerHTML=`<section class="hero"><div class="wrap"><div class="eyebrow">Your study companion</div><h1>Medical notes,<br>made easier.</h1><p>Explore notes by subject, choose the sub-subject and quality package that suits you, and place an order in a few simple steps.</p><div class="stats"><span class="stat">${db.subjects.length} subjects listed</span><span class="stat">High · Medium · Low · Regular</span><span class="stat">WhatsApp order hand-off</span></div><div class="actions"><button class="gold" onclick="CB.page('catalog')">Explore catalogue</button><button class="secondary" onclick="CB.page('track')">Track an order</button></div></div></section><section class="section wrap"><div class="heading"><div><h2>How it works</h2><div class="muted">Choose precisely what you need.</div></div></div><div class="grid"><div class="panel"><span class="pill">01 · Browse</span><h3>Choose a subject</h3><p class="muted">Open a subject and select its sub-subject.</p></div><div class="panel"><span class="pill">02 · Select</span><h3>Pick a quality</h3><p class="muted">Compare High, Medium, Low or Regular variants, with individual prices and samples.</p></div><div class="panel"><span class="pill">03 · Order</span><h3>Checkout & WhatsApp</h3><p class="muted">Submit your order, then open WhatsApp with a prefilled message to the business.</p></div></div><div class="notice">Prototype notice: orders and catalogue changes are saved only in this browser. This demo does not provide a shared live database or online payment gateway.</div></section>`}
function catalog(){document.getElementById('app').innerHTML=`<section class="section wrap"><div class="heading"><div><h2>Notes catalogue</h2><div class="muted">Subject → Sub-subject → Quality variant</div></div><input class="search" id="searchSubjects" placeholder="Search subjects or notes…"></div><div id="subjectGrid" class="grid"></div></section>`;renderSubjects();document.getElementById('searchSubjects').addEventListener('input',renderSubjects)}
function renderSubjects(){let q=(document.getElementById('searchSubjects')?.value||'').toLowerCase();let list=db.subjects.filter(s=>(s.name+' '+s.description+' '+s.subs.map(b=>b.name).join(' ')).toLowerCase().includes(q));document.getElementById('subjectGrid').innerHTML=list.length?list.map(s=>`<article class="card"><div class="cover">${s.image?`<img src="${esc(s.image)}" alt="${esc(s.name)}" onerror="this.style.display='none'">`:'✚'}</div><div class="cardbody"><div class="row between"><h3>${esc(s.name)}</h3><span class="pill">${s.subs.length} sections</span></div><p>${esc(s.description)}</p><button class="secondary" onclick="CB.openSubject('${s.id}')">View sub-subjects</button></div></article>`).join(''):'<div class="empty">No matching subjects found.</div>'}
function openSubject(sid){let s=db.subjects.find(x=>x.id===sid);if(!s)return;document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)CB.closeModal()"><div class="modal"><div class="modalhead"><div><span class="pill">Subject</span><h3>${esc(s.name)}</h3></div><button class="outline" onclick="CB.closeModal()">✕</button></div><p class="muted">${esc(s.description)}</p><div class="sublist">${s.subs.map(b=>`<div class="subitem"><h4>${esc(b.name)}</h4><p>${esc(b.description)}</p><div class="variants">${b.variants.map(v=>`<div class="variant"><strong>${esc(v.name)} quality</strong><div class="price">${money(v.price)}</div><p>${esc(v.description)}</p>${v.sampleUrl?`<a href="${esc(v.sampleUrl)}" target="_blank" rel="noopener">View sample PDF ↗</a>`:'<span class="tiny muted">Sample not uploaded</span>'}<div class="actions"><button class="small" ${!v.available?'disabled':''} onclick="CB.addCart('${s.id}','${b.id}','${v.id}')">${v.available?'Add to cart':'Unavailable'}</button></div></div>`).join('')}</div></div>`).join('')}</div></div></div>`}
function addCart(sid,bid,vid){let {s,b,v}=findVariant(sid,bid,vid);if(!v||!v.available)return toast('This variant is unavailable.');let item=db.cart.find(x=>x.vid===vid);if(item)item.qty++;else db.cart.push({sid,bid,vid,qty:1});save();toast('Added to cart.');closeModal()}
function cartPage(){let total=db.cart.reduce((sum,x)=>sum+(findVariant(x.sid,x.bid,x.vid).v?.price||0)*x.qty,0);document.getElementById('app').innerHTML=`<section class="section wrap"><div class="heading"><div><h2>Your cart</h2><div class="muted">Review selected subject, sub-subject and quality.</div></div><button class="secondary" onclick="CB.page('catalog')">Continue browsing</button></div>${db.cart.length?`<div class="panel"><div class="tablewrap"><table><thead><tr><th>Item</th><th>Quality</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th></th></tr></thead><tbody>${db.cart.map((x,i)=>{let {s,b,v}=findVariant(x.sid,x.bid,x.vid);return v?`<tr><td><b>${esc(s.name)}</b><br>${esc(b.name)}</td><td>${esc(v.name)}</td><td>${money(v.price)}</td><td><div class="qty"><button class="secondary small" onclick="CB.qty(${i},-1)">−</button>${x.qty}<button class="secondary small" onclick="CB.qty(${i},1)">+</button></div></td><td><b>${money(v.price*x.qty)}</b></td><td><button class="danger small" onclick="CB.removeCart(${i})">Remove</button></td></tr>`:''}).join('')}</tbody></table></div><div class="row between" style="margin-top:18px"><div><span class="muted">Cart total</span><div class="price">${money(total)}</div></div><button class="success" onclick="CB.checkout()">Proceed to checkout</button></div></div>`:'<div class="panel empty">Your cart is empty.<br><button style="margin-top:12px" onclick="CB.page(\'catalog\')">Browse catalogue</button></div>'}</section>`}
function qty(i,d){db.cart[i].qty+=d;if(db.cart[i].qty<1)db.cart.splice(i,1);save();cartPage()}function removeCart(i){db.cart.splice(i,1);save();cartPage()}
function checkout(){if(!db.cart.length)return;let total=db.cart.reduce((sum,x)=>sum+(findVariant(x.sid,x.bid,x.vid).v?.price||0)*x.qty,0);document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h3>Checkout</h3><button class="outline" onclick="CB.closeModal()">✕</button></div><form id="checkoutForm"><div class="grid"><div class="field"><label>Full name *</label><input name="name" required maxlength="80"></div><div class="field"><label>Mobile number *</label><input name="mobile" required inputmode="tel" pattern="[0-9+() -]{10,18}" placeholder="10-digit mobile"></div></div><div class="field"><label>Email (optional)</label><input name="email" type="email"></div><div class="field"><label>Fulfilment method *</label><select name="method" id="method"><option value="Delivery">Delivery</option><option value="Pickup">Pickup</option></select></div><div class="field" id="addressField"><label>Delivery address *</label><textarea name="address" rows="3" required></textarea></div><div class="field"><label>Additional instructions (optional)</label><textarea name="notes" rows="2"></textarea></div><div class="notice">Order total: <b>${money(total)}</b>. No online payment is collected by this prototype. The team will confirm availability and payment instructions.</div><button class="success" type="submit" style="width:100%">Place order</button></form></div></div>`;let f=document.getElementById('checkoutForm'),m=f.elements.method,a=f.elements.address; m.addEventListener('change',()=>{document.getElementById('addressField').classList.toggle('hidden',m.value==='Pickup');a.required=m.value==='Delivery'});f.addEventListener('submit',e=>{e.preventDefault();let data=Object.fromEntries(new FormData(f));let lines=db.cart.map(x=>{let z=findVariant(x.sid,x.bid,x.vid);return `${z.s.name} > ${z.b.name} > ${z.v.name} quality x ${x.qty} — ${money(z.v.price*x.qty)}`});let order={id:id('CB'),created:new Date().toISOString(),customer:{name:data.name,mobile:data.mobile,email:data.email,method:data.method,address:data.address,notes:data.notes},items:db.cart.map(x=>({...x})),lines,total,status:'Pending',whatsappOpened:false,whatsappSentUnknown:true};db.orders.unshift(order);db.cart=[];save();closeModal();orderConfirmation(order.id)})}
function orderConfirmation(oid){let o=db.orders.find(x=>x.id===oid);document.getElementById('app').innerHTML=`<section class="section wrap"><div class="panel"><span class="pill">Order placed</span><h2>Thank you, ${esc(o.customer.name)}!</h2><p>Your order has been saved in this browser.</p><div class="orderbox"><b>Order ID</b><div class="price">${esc(o.id)}</div><div class="muted">Total: ${money(o.total)} · Status: <span class="status Pending">Pending</span></div></div><div class="notice">Next: open WhatsApp and send the prepared order message to Copy Baba. WhatsApp will not send automatically. If you close WhatsApp without sending, return here and use the retry button.</div><div class="actions"><button class="success" onclick="CB.whatsapp('${o.id}')">Open WhatsApp with order message</button><button class="secondary" onclick="CB.whatsapp('${o.id}')">Retry WhatsApp</button><button class="outline" onclick="CB.page('track')">Track this order</button></div><p class="tiny muted">WhatsApp cannot tell this website whether you pressed Send. Your order remains recorded here regardless.</p></div></section>`}
function waText(o){let c=o.customer;return `Hello ${db.settings.businessName}, I would like to confirm this order.\n\nOrder ID: ${o.id}\nName: ${c.name}\nMobile: ${c.mobile}\nFulfilment: ${c.method}\n${c.method==='Delivery'?'Address: '+(c.address||'')+'\n':''}Items:\n${o.lines.join('\n')}\n\nTotal: ${money(o.total)}\nNotes: ${c.notes||'None'}\n\nPlease confirm availability, delivery/pickup details and payment instructions.`}
function whatsapp(oid){let o=db.orders.find(x=>x.id===oid);let num=(db.settings.whatsappNumber||'').replace(/\D/g,'');if(!num){toast('Business WhatsApp number is not configured. Please contact the business or ask admin to set it.');return}let url='https://wa.me/'+num+'?text='+encodeURIComponent(waText(o));o.whatsappOpened=true;save();window.open(url,'_blank','noopener');}
function trackPage(){document.getElementById('app').innerHTML=`<section class="section wrap"><div class="heading"><div><h2>Track your order</h2><div class="muted">Enter the order ID and mobile number used at checkout.</div></div></div><div class="panel" style="max-width:620px"><form id="trackForm"><div class="field"><label>Order ID</label><input name="id" required placeholder="CB-..."></div><div class="field"><label>Mobile number</label><input name="mobile" required></div><button>Find order</button></form><div id="trackResult"></div></div></section>`;document.getElementById('trackForm').addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),o=db.orders.find(x=>x.id.toLowerCase()===d.id.trim().toLowerCase()&&x.customer.mobile.replace(/\D/g,'')===d.mobile.replace(/\D/g,''));document.getElementById('trackResult').innerHTML=o?orderMarkup(o):'<p class="dangertext">No matching order found in this browser. Check the details or contact the business.</p>'})}
function orderMarkup(o){return `<div class="orderbox"><div class="row between"><h4>${esc(o.id)}</h4><span class="status ${esc(o.status)}">${esc(o.status)}</span></div><p class="tiny muted">${new Date(o.created).toLocaleString()}</p><p><b>${esc(o.customer.method)}</b> · ${esc(o.customer.name)}</p><ul>${o.lines.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><b>Total: ${money(o.total)}</b><p class="tiny muted">${esc(o.customer.notes||'')}</p><button class="secondary small" onclick="CB.whatsapp('${o.id}')">Open / retry WhatsApp message</button></div>`}
function adminPage(){if(!db.adminLoggedIn){document.getElementById('app').innerHTML=`<section class="section wrap"><div class="panel" style="max-width:460px;margin:25px auto"><h2>Admin login</h2><p class="muted">Demo access for this browser prototype.</p><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="pass" type="password" required></div><button class="dark" style="width:100%">Sign in</button></form><div class="notice">Demo: ${ADMIN_EMAIL}<br>Password: ${ADMIN_PASS}<br>Change these only in your own private prototype copy; this is not secure authentication.</div></div></section>`;document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(d.email===ADMIN_EMAIL&&d.pass===ADMIN_PASS){db.adminLoggedIn=true;save();adminPage()}else toast('Incorrect demo login.')});return}document.getElementById('app').innerHTML=`<section class="section wrap"><div class="heading"><div><h2>Admin dashboard</h2><div class="muted">Manage catalogue, orders and WhatsApp configuration.</div></div><button class="danger" onclick="CB.logout()">Log out</button></div><div class="adminbar"><button class="active" data-admin="orders">Orders (${db.orders.length})</button><button class="secondary" data-admin="catalogue">Catalogue</button><button class="secondary" data-admin="settings">Settings</button></div><div id="adminContent"></div></section>`;document.querySelectorAll('[data-admin]').forEach(b=>b.addEventListener('click',()=>adminTab(b.dataset.admin)));adminTab('orders')}
function adminTab(t){document.querySelectorAll('[data-admin]').forEach(b=>{b.classList.toggle('active',b.dataset.admin===t);b.classList.toggle('secondary',b.dataset.admin!==t)});let el=document.getElementById('adminContent');if(t==='orders'){const perPage=10;let page=Number(CB._adminOrdersPage||1);let orders=[...db.orders].sort((a,b)=>new Date(b.created)-new Date(a.created));let totalPages=Math.max(1,Math.ceil(orders.length/perPage));if(page<1)page=1;if(page>totalPages)page=totalPages;CB._adminOrdersPage=page;let slice=orders.slice((page-1)*perPage,page*perPage);el.innerHTML=`<div class="panel"><div class="heading"><div><h3>Customer orders</h3><p class="muted tiny">Only orders created in this browser are visible.</p></div><button class="secondary small" onclick="CB.exportOrders()">Export CSV</button></div>${orders.length?`<div class="orders-list">${slice.map(o=>`<div class="orderbox"><div class="row between"><h4>${esc(o.id)} · ${esc(o.customer.name)}</h4><span class="status ${esc(o.status)}">${esc(o.status)}</span></div><p class="tiny muted">${new Date(o.created).toLocaleString()} · ${esc(o.customer.mobile)} · ${esc(o.customer.method)}</p><p>${o.lines.map(esc).join('<br>')}</p><b>${money(o.total)}</b><div class="row" style="margin-top:10px;flex-wrap:wrap;gap:6px"><select id="st-${o.id}">${['Pending','Confirmed','Processing','Ready','Dispatched','Completed','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="small" onclick="CB.setStatus('${o.id}')">Update status</button><button class="small secondary" onclick="CB.whatsapp('${o.id}')">WhatsApp</button></div></div>`).join('')}</div><div class="pagination"><button class="small outline" onclick="CB._adminOrdersPage=${page-1};CB.adminTab('orders')" ${page===1?'disabled':''}>Previous</button><span class="page-info">Page ${page} of ${totalPages} (${orders.length} orders)</span><button class="small outline" onclick="CB._adminOrdersPage=${page+1};CB.adminTab('orders')" ${page===totalPages?'disabled':''}>Next</button></div>`:'<div class="empty">No orders yet.</div>'}</div>`}else if(t==='settings'){el.innerHTML=`<div class="panel"><h3>Business & WhatsApp settings</h3><form id="settingsForm"><div class="field"><label>Business name</label><input name="businessName" value="${esc(db.settings.businessName)}" required></div><div class="field"><label>WhatsApp number (with country code)</label><input name="whatsappNumber" value="${esc(db.settings.whatsappNumber)}" placeholder="919876543210"><small class="muted">India example: 91 followed by the 10-digit number. Enter digits only. Do not include + or spaces.</small></div><div class="field"><label>Default displayed package price (seed data only)</label><input name="packagePrice" type="number" min="0" value="${Number(db.settings.packagePrice)||0}"></div><div class="field"><label>Delivery note</label><textarea name="deliveryNote">${esc(db.settings.deliveryNote)}</textarea></div><button>Save settings</button><button type="button" class="secondary" onclick="CB.testWhatsApp()">Send test message</button></form><div class="notice">WhatsApp Click to Chat is free to use, subject to your normal internet/data charges. The customer must press Send. This site cannot verify delivery or read replies.</div></div>`;document.getElementById('settingsForm').addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.settings={...db.settings,...d,packagePrice:Number(d.packagePrice)};save();toast('Settings saved.')})}else{el.innerHTML=`<div class="panel"><div class="heading"><div><h3>Catalogue manager</h3><p class="muted tiny">Each sub-subject has its own independent quality variants.</p></div><button onclick="CB.addSubject()">+ Add subject</button></div><div class="field"><input id="adminSearch" placeholder="Filter subjects…"></div><div id="manageSubjects"></div></div>`;renderManageSubjects();document.getElementById('adminSearch').addEventListener('input',renderManageSubjects)}}
const openAdminSubjects=new Set();const openAdminSubs=new Set();
function toggleAdminSubject(sid){if(openAdminSubjects.has(sid))openAdminSubjects.delete(sid);else openAdminSubjects.add(sid);renderManageSubjects()}
function toggleAdminSub(sid,bid){let key=sid+'|'+bid;if(openAdminSubs.has(key))openAdminSubs.delete(key);else openAdminSubs.add(key);renderManageSubjects()}
function renderManageSubjects(){
 let q=(document.getElementById('adminSearch')?.value||'').toLowerCase();
 let subjectsList=db.subjects.filter(s=>(s.name+' '+s.subs.map(b=>b.name).join(' ')).toLowerCase().includes(q));
 document.getElementById('manageSubjects').innerHTML=subjectsList.length?`<div class="catalogue-tree">${subjectsList.map(s=>{
  let subjectOpen=openAdminSubjects.has(s.id);
  let visibleSubs=s.subs.filter(b=>(s.name+' '+b.name).toLowerCase().includes(q));
  return `<article class="catalogue-subject">
   <div class="catalogue-subject-head">
    <button class="subject-toggle" aria-label="${subjectOpen?'Collapse':'Expand'} ${esc(s.name)}" aria-expanded="${subjectOpen}" onclick="CB.toggleAdminSubject('${s.id}')"><span class="accordion-arrow ${subjectOpen?'open':''}">›</span></button>
    <div class="subject-name">${esc(s.name)}</div>
    <span class="subject-meta">${s.subs.length} sub-subject${s.subs.length===1?'':'s'}</span>
    <div class="catalogue-subject-actions">
     <button class="small secondary" onclick="CB.editSubject('${s.id}')">Edit</button>
     <button class="small danger" onclick="CB.deleteSubject('${s.id}')">Delete</button>
    </div>
   </div>
   ${subjectOpen?`<div class="catalogue-subject-body"><div class="catalogue-sublist">${visibleSubs.map(b=>{
    let key=s.id+'|'+b.id,subOpen=openAdminSubs.has(key);
    return `<section class="catalogue-sub">
     <div class="catalogue-sub-head">
      <button class="sub-toggle" aria-label="${subOpen?'Collapse':'Expand'} ${esc(b.name)}" aria-expanded="${subOpen}" onclick="CB.toggleAdminSub('${s.id}','${b.id}')"><span class="accordion-arrow ${subOpen?'open':''}">›</span></button>
      <div class="sub-name">${esc(b.name)}</div>
      <span class="sub-meta">${b.variants.length} quality options</span>
      <div class="catalogue-sub-actions">
       <button class="small secondary" onclick="CB.editSub('${s.id}','${b.id}')">Edit</button>
       <button class="small danger" onclick="CB.deleteSub('${s.id}','${b.id}')">Delete</button>
      </div>
     </div>
     ${subOpen?`<div class="catalogue-sub-body"><p class="variant-summary">${b.variants.map(v=>`<span>${esc(v.name)}: <b>${money(v.price)}</b>${v.available?'':' · Unavailable'}</span>`).join('')}</p><button class="small" onclick="CB.editVariants('${s.id}','${b.id}')">Manage quality variants</button></div>`:''}
    </section>`;
   }).join('')||'<div class="empty">No matching sub-subjects.</div>'}</div><button class="small" style="margin-top:10px" onclick="CB.addSub('${s.id}')">+ Add sub-subject</button></div>`:''}
  </article>`;
 }).join('')}</div>`:'<p class="empty">No subjects match.</p>';
}
function modalForm(title,fields,submit){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)CB.closeModal()"><div class="modal"><div class="modalhead"><h3>${title}</h3><button class="outline" onclick="CB.closeModal()">✕</button></div><form id="editForm">${fields}<div class="actions"><button>Save</button><button type="button" class="secondary" onclick="CB.closeModal()">Cancel</button></div></form></div></div>`;document.getElementById('editForm').addEventListener('submit',e=>{e.preventDefault();submit(Object.fromEntries(new FormData(e.target)))})}
function addSubject(){modalForm('Add subject',`<div class="field"><label>Subject name</label><input name="name" required></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Image URL (optional)</label><input name="image" type="url"></div>`,d=>{db.subjects.push({id:id('S'),name:d.name,description:d.description,image:d.image,subs:[]});save();closeModal();adminTab('catalogue')})}function editSubject(sid){let s=db.subjects.find(x=>x.id===sid);modalForm('Edit subject',`<div class="field"><label>Name</label><input name="name" value="${esc(s.name)}" required></div><div class="field"><label>Description</label><textarea name="description">${esc(s.description)}</textarea></div><div class="field"><label>Image URL</label><input name="image" value="${esc(s.image)}"></div>`,d=>{Object.assign(s,d);save();closeModal();adminTab('catalogue')})}function deleteSubject(sid){if(confirm('Delete this subject and all its sub-subjects?')){db.subjects=db.subjects.filter(s=>s.id!==sid);save();adminTab('catalogue')}}
function addSub(sid){modalForm('Add sub-subject',`<div class="field"><label>Sub-subject name</label><input name="name" required></div><div class="field"><label>Description</label><textarea name="description"></textarea></div>`,d=>{let s=db.subjects.find(x=>x.id===sid);s.subs.push({id:id('B'),...d,variants:['High','Medium','Low','Regular'].map(n=>({id:id('V'),name:n,price:3500,description:'',image:'',sampleUrl:'',available:true}))});save();closeModal();adminTab('catalogue')})}function editSub(sid,bid){let b=findVariant(sid,bid,'').b;modalForm('Edit sub-subject',`<div class="field"><label>Name</label><input name="name" value="${esc(b.name)}" required></div><div class="field"><label>Description</label><textarea name="description">${esc(b.description)}</textarea></div>`,d=>{Object.assign(b,d);save();closeModal();adminTab('catalogue')})}function deleteSub(sid,bid){if(confirm('Delete this sub-subject and its variants?')){let s=db.subjects.find(x=>x.id===sid);s.subs=s.subs.filter(b=>b.id!==bid);save();adminTab('catalogue')}}
function editVariants(sid,bid){let b=findVariant(sid,bid,'').b;let fields=b.variants.map((v,i)=>`<div class="subitem"><h4>${esc(v.name)} quality</h4><input type="hidden" name="id${i}" value="${v.id}"><div class="field"><label>Display name</label><input name="name${i}" value="${esc(v.name)}" required></div><div class="field"><label>Price (₹)</label><input name="price${i}" type="number" min="0" step="1" value="${v.price}" required></div><div class="field"><label>Description</label><textarea name="desc${i}">${esc(v.description)}</textarea></div><div class="field"><label>Picture URL</label><input name="image${i}" value="${esc(v.image)}" placeholder="https://..."></div><div class="field"><label>Sample PDF URL</label><input name="sample${i}" value="${esc(v.sampleUrl)}" placeholder="https://..."></div><label><input type="checkbox" name="available${i}" ${v.available?'checked':''}> Available for ordering</label></div>`).join('')+`<div class="notice">Each quality variant has its own price, description, image, sample PDF and availability.</div>`;modalForm('Manage quality variants',fields,d=>{b.variants.forEach((v,i)=>{v.name=d['name'+i];v.price=Number(d['price'+i]);v.description=d['desc'+i];v.image=d['image'+i];v.sampleUrl=d['sample'+i];v.available=!!d['available'+i]});save();closeModal();adminTab('catalogue')})}
function setStatus(oid){let o=db.orders.find(x=>x.id===oid);o.status=document.getElementById('st-'+oid).value;save();adminTab('orders');toast('Order status updated.')}
function exportOrders(){let rows=[['Order ID','Date','Customer','Mobile','Fulfilment','Address','Items','Total','Status'],...db.orders.map(o=>[o.id,o.created,o.customer.name,o.customer.mobile,o.customer.method,o.customer.address,o.lines.join(' | '),o.total,o.status])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='copy-baba-orders.csv';a.click();URL.revokeObjectURL(a.href)}function testWhatsApp(){let num=(db.settings.whatsappNumber||'').replace(/\D/g,'');if(!num)return toast('Enter a WhatsApp number first.');window.open('https://wa.me/'+num+'?text='+encodeURIComponent('Hello '+db.settings.businessName+', this is a test message from the Copy Baba website.'),'_blank','noopener')}
function logout(){db.adminLoggedIn=false;save();adminPage()}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
window.CB={page,openSubject,addCart,qty,removeCart,checkout,whatsapp,closeModal,logout,addSubject,editSubject,deleteSubject,addSub,editSub,deleteSub,editVariants,setStatus,exportOrders,testWhatsApp,toggleAdminSubject,toggleAdminSub};updateCartCount();home();
})();
</script>
</body></html>
